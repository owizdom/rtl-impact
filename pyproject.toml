[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rtl-impact"
version = "0.1.0"
description = "Change impact and node identity over RTL netlist graphs, with .tapeout export"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rtl-impact = "rtl_impact.cli:main"

[tool.setuptools.packages.find]
include = ["rtl_impact*"]
